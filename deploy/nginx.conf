# Hot AI Nginx bootstrap (HTTP only).
#
# Keep this file HTTP-only until certbot has issued a certificate. Enabling an
# `ssl` listener before certificate files exist makes `nginx -t` fail on a
# fresh host. After issuance, install deploy/nginx-https.conf and reload.
limit_req_zone $binary_remote_addr zone=hotai_ask:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=hotai_public_fetch:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name hotai.yeuxark.com;

    # Allow Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Proxy remains available during bootstrap; the HTTPS config adds the
    # redirect once a certificate is present.
    location = /api/ask {
        limit_req zone=hotai_ask burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Bound public remote-fetch work before it reaches the shared PostgreSQL
    # limiter. The application still enforces its stricter per-route quotas.
    location ~ ^/api/(readability|proxy/feed|catalog/pull)$ {
        limit_req zone=hotai_public_fetch burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not append, so clients cannot forge the identity used
        # by application rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    client_max_body_size 1m;
}
