# Hot AI Nginx HTTPS server. Install after certbot has issued the certificate.
limit_req_zone $binary_remote_addr zone=hotai_ask:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=hotai_public_fetch:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name hotai.yeuxark.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hotai.yeuxark.com;

    # This server is only selected after TLS is provisioned; advertise the
    # HTTPS-only policy to browsers and prevent downgrade on later visits.
    add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate /etc/letsencrypt/live/hotai.yeuxark.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotai.yeuxark.com/privkey.pem;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/rss+xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/ask {
        limit_req zone=hotai_ask burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Bound public remote-fetch work before it reaches the shared PostgreSQL
    # limiter. The application still enforces its stricter per-route quotas.
    location ~ ^/api/(readability|proxy/feed|catalog/pull)$ {
        limit_req zone=hotai_public_fetch burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    client_max_body_size 1m;
}
