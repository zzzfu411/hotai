name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # isomorphic-dompurify/jsdom 30 requires Node 22.22.2+ on the LTS line.
        node: ['22.22.2']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hotai
          POSTGRES_PASSWORD: hotai
          POSTGRES_DB: hotai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotai -d hotai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hotai:hotai@localhost:5432/hotai_test?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Hot AI
      # CI must never make an external model request.
      ANTHROPIC_AUTH_TOKEN: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_BASE_URL: ''
      ALLOW_THIRD_PARTY_AI: 'false'
      ALLOW_INSECURE_AI_HTTP: 'false'
      AI_DIGEST_ENABLED: 'false'
      AI_ENRICH_PER_RUN: '0'
      RUN_DB_TESTS: '1'
      REVALIDATE_SECRET: ci-only-secret
      REVALIDATE_URL: http://localhost:3000/api/revalidate

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          test "$(corepack pnpm --version)" = "9.12.0"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate and migrate Prisma client
        run: |
          corepack pnpm --filter @hotai/db generate
          corepack pnpm --filter @hotai/db exec prisma migrate deploy
          corepack pnpm --filter @hotai/db exec tsx src/seed.ts

      - name: Validate Prisma schema
        run: corepack pnpm --filter @hotai/db exec prisma validate --schema prisma/schema.prisma

      - name: Unit tests
        run: corepack pnpm test

      - name: Typecheck every workspace package
        run: corepack pnpm typecheck

      - name: Lint web app
        run: corepack pnpm lint

      - name: Build production artifacts
        run: corepack pnpm build

      - name: Seed deterministic browser corpus
        run: corepack pnpm test:seed

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Browser user-path regression
        run: corepack pnpm smoke:browser

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: output/playwright/
          retention-days: 7

      - name: Read-only release content gate
        run: corepack pnpm release:check

      - name: Smoke-test compiled fetcher
        run: corepack pnpm --filter @hotai/fetcher smoke

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          test "$(corepack pnpm --version)" = "9.12.0"

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run production dependency audit
        run: corepack pnpm audit --prod --audit-level=moderate
